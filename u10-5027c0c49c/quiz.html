<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unit 10 · Quiz</title><style>html,body{margin:0}*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wm{position:fixed;inset:0;pointer-events:none;z-index:9}
#ld{font-family:Tahoma,Arial,sans-serif;text-align:center;padding:60px 20px;color:#5b6675}
@media print{body{display:none!important}}</style></head><body><div class="wrap" id="app"><div id="ld">جارٍ التحميل…</div></div><div id="wm"></div><script>
var K=[224,113,151,2,118,22,121,73,44,145,35,101,51,17,233,202,166,180,170,30,189,181,250,84,185,154,57,213,227,84,170,235];
var okHost=/(^|\.)github\.io$/.test(location.hostname)||location.hostname==='localhost';
function load(f){return fetch(f,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(b){var u=new Uint8Array(b);for(var i=0;i<u.length;i++)u[i]^=K[(i*7+3)%K.length];return JSON.parse(new TextDecoder().decode(u))})}
function mark(t){var s='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><text x="150" y="100" text-anchor="middle" transform="rotate(-24 150 100)" font-family="Tahoma,Arial" font-size="17" fill="#000" fill-opacity="0.07">'+t+'</text></svg>';document.getElementById('wm').style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(s)+'")'}
function css(c){var e=document.createElement('style');e.textContent=c;document.head.appendChild(e)}
function fail(){document.getElementById('ld').textContent='هذه الصفحة تعمل من الرابط الأصلي فقط.'}
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&/^[spuSPU]$/.test(e.key))e.preventDefault()});

var D;
var app=document.getElementById('app'),S=null;
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||'null')}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function wrongs(){return ls('u10wrong')||[]}
function setWrong(n,add){var w=wrongs().filter(function(x){return x!==n});if(add)w.push(n);ls('u10wrong',w)}
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){
  var best=ls('u10best')||{},w=wrongs(),s='<h1>⚡ Unit 10 · Electrical Safety</h1><div class="sub">اختر موضوعًا وابدأ التدريب</div>';
  Object.keys(D.topics).forEach(function(k){var n=D.qs.filter(function(q){return q.t===k}).length;
    s+='<button class="topic" data-t="'+k+'"><span><b>'+h(D.topics[k][1])+'</b><span class="e">'+h(D.topics[k][0])+'</span></span><span class="c">'+(best[k]!=null?best[k]+'% · ':'')+n+'</span></button>'});
  s+='<button class="topic all" data-t="*"><span><b>كل الأسئلة</b><span class="e">All questions</span></span><span class="c" style="color:#0f4c81">'+D.qs.length+'</span></button>';
  s+='<button class="topic all" data-t="r"><span><b>اختبار سريع</b><span class="e">20 random questions</span></span><span class="c" style="color:#0f4c81">20</span></button>';
  if(w.length)s+='<button class="topic err" data-t="w"><span><b>راجع أخطائي</b><span class="e">My mistakes</span></span><span class="c">'+w.length+'</span></button>';
  app.innerHTML=s;
  [].forEach.call(app.querySelectorAll('.topic'),function(b){b.onclick=function(){start(b.getAttribute('data-t'))}});
  window.scrollTo(0,0);
}
function start(t){
  var list;
  if(t==='*')list=D.qs;else if(t==='r')list=shuffle(D.qs).slice(0,20);
  else if(t==='w'){var w=wrongs();list=D.qs.filter(function(q){return w.indexOf(q.n)>=0})}
  else list=D.qs.filter(function(q){return q.t===t});
  S={t:t,list:shuffle(list),i:0,ok:0};show();
}
function show(){
  var q=S.list[S.i],order=shuffle(q.o.map(function(_,i){return i}));
  var s='<button class="home" id="hm">→ القائمة</button><div class="bar"><i style="width:'+(S.i/S.list.length*100)+'%"></i></div>';
  s+='<div class="meta"><span>سؤال '+(S.i+1)+' من '+S.list.length+'</span><span>صح: '+S.ok+'</span></div>';
  s+='<div class="card"><div class="qen">'+h(q.q)+'</div>'+(q.img?'<img src="'+q.img+'" alt="">':'')+'<button class="tr" id="tr">ترجمة السؤال</button><div class="qar" id="qar">'+h(q.arq)+'</div></div>';
  order.forEach(function(i){s+='<button class="opt" data-i="'+i+'">'+h(q.o[i])+'</button>'});
  s+='<div class="fb" id="fb"></div><button class="next" id="nx">'+(S.i+1<S.list.length?'السؤال التالي ←':'النتيجة')+'</button>';
  app.innerHTML=s;
  document.getElementById('hm').onclick=home;
  document.getElementById('tr').onclick=function(){document.getElementById('qar').style.display='block'};
  var done=false;
  [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
    if(done)return;done=true;var i=+b.getAttribute('data-i'),ok=i===q.a;
    [].forEach.call(app.querySelectorAll('.opt'),function(x){if(+x.getAttribute('data-i')===q.a)x.className='opt ok'});
    if(!ok)b.className='opt no';else S.ok++;
    setWrong(q.n,!ok);
    var fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');fb.style.display='block';
    fb.innerHTML=(ok?'✓ صح! ':'✗ الإجابة الصحيحة: ')+'<b>'+h(q.ara)+'</b>'+(q.u?'<small>⚠ هذه الإجابة غير مؤكدة — راجعها من ملزمة المادة</small>':'');
    document.getElementById('qar').style.display='block';
    var nx=document.getElementById('nx');nx.style.display='block';nx.scrollIntoView({block:'nearest'});
  }});
  document.getElementById('nx').onclick=function(){S.i++;if(S.i<S.list.length)show();else result()};
  window.scrollTo(0,0);
}
function result(){
  var p=Math.round(S.ok/S.list.length*100);
  if(D.topics[S.t]){var b=ls('u10best')||{};if(b[S.t]==null||p>b[S.t]){b[S.t]=p;ls('u10best',b)}}
  var w=wrongs().length;
  app.innerHTML='<div class="card res"><div>نتيجتك</div><div class="big">'+S.ok+' / '+S.list.length+'</div><div>'+p+'%</div><div style="margin-top:6px">'+(p>=85?'ممتاز! 👏':p>=60?'جيد — راجع أخطاءك وحاول مرة ثانية':'راجع الكلمات المهمة ثم أعد المحاولة')+'</div>'+
  (w?'<button class="alt" id="rw">راجع أخطائي ('+w+')</button>':'')+'<button id="ag">أعد المحاولة</button><button id="hm2">القائمة</button></div>';
  if(w)document.getElementById('rw').onclick=function(){start('w')};
  var t=S.t;document.getElementById('ag').onclick=function(){start(t)};document.getElementById('hm2').onclick=home;
  window.scrollTo(0,0);
}

if(!okHost)fail();else load('q.dat').then(function(d){css(d.css);D=d.data;mark(d.wm);home()}).catch(fail);
</script></body></html>
